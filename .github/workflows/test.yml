name: Test

on: 
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pymongo-version: ["4.9", "4.17.0"]
        mongodb-version: ["7.0", "8.0", "8.3"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}--${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-
      - name: Install MongoDB
        run: |
          mongodbVersion="${{ matrix.mongodb-version }}"
          keyVersion=${mongodbVersion%%.*}.0
          sudo apt-get install -y gnupg curl
          curl -fsSL https://pgp.mongodb.com/server-${keyVersion}.asc | \
              sudo gpg -o /usr/share/keyrings/mongodb-server-${keyVersion}.gpg \
              --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-${keyVersion}.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/${mongodbVersion} multiverse" | \
              sudo tee /etc/apt/sources.list.d/mongodb-org-${mongodbVersion}.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
      - name: Run test
        run: |
          python -m pip install -U pip
          # Use tox-gh to configure the python environment
          # See https://github.com/tox-dev/tox-gh
          python -m pip install tox_gh pymongo==${{ matrix.pymongo-version }}
          tox
 
