name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        pymongo-version: ["4.9", "4.16"]
        mongodb-version: ["7.0", "8.0"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}--${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-
      - name: Install MongoDB
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-${{ matrix.mongodb-version }}.asc | \
              sudo gpg -o /usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg \
              --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/${{ matrix.mongodb-version }} multiverse" | \
              sudo tee /etc/apt/sources.list.d/mongodb-org-${{ matrix.mongodb-version }}.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
      - name: Run test
        run: |
          python -m pip install -U pip
          # Use tox-gh to configure the python environment
          # See https://github.com/tox-dev/tox-gh
          python -m pip install tox_gh pymongo==${{ matrix.pymongo-version }}
          tox
 
